name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Raw pinned CLI replaces gitleaks-action@v2, which is license-gated for
      # organization accounts and aborted before scanning
      # (findings/2026-08-18-secret-scan-ci-inoperative.md).
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tgz gitleaks
          gitleaks version

      - name: Scan commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          RANGE=""
          if [ "$EVENT" = "pull_request" ]; then
            if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              RANGE="${BASE_SHA}..${HEAD_SHA}"
            fi
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          fi
          if [ -n "$RANGE" ]; then
            echo "Scanning commit range: $RANGE"
            gitleaks git . --log-opts "$RANGE" --no-banner --redact --verbose
          else
            echo "No resolvable prior ref (new branch or rewritten history): scanning full history"
            gitleaks git . --no-banner --redact --verbose
          fi
